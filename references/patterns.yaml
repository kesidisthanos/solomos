    why: "Κοφτή αφηρημένη αυτο-υπεράσπιση που ακούγεται σαν συμπιεσμένα αγγλικά."
    context: |
      Η πλήρης φράση «δεν είναι δικαιολογία» ΔΕΝ απαγορεύεται: στέκει ανάλογα
      με τα συμφραζόμενα, απλώς συχνά είναι λιγότερο ζεστή από μια σχεσιακή
      εκδοχή.
