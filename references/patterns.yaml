# Σολωμός: κατάλογος μοτίβων (έκδοση με βαθμίδες ισχύος, 2026-10)
#
# Δίχτυ ασφαλείας, όχι συνταγή γραφής. Φορτώνεται στο τελικό φίλτρο της
# σύνταξης και στα βήματα «Σημάδια» και «Έλεγχος» της επιμέλειας (polish.md).
#
# Γιατί υπάρχουν αυτά τα σημάδια: το μοντέλο γράφει ό,τι είναι πιθανότερο
# να ακολουθήσει, άρα διαλέγει την επιλογή που ταιριάζει στους
# περισσότερους αναγνώστες και θέματα. Ο άνθρωπος διαλέγει για έναν
# αναγνώστη και ένα θέμα. Κάθε μοτίβο εδώ είναι μορφή αυτής της «μέσης»
# επιλογής: πρόταση που δηλώνει σημασία αντί να προσθέτει γεγονός, ρυθμός
# εφαρμοσμένος από κανόνα, συνηθισμένο γεγονός ντυμένο ως ορόσημο,
# αγγλική σκέψη με ελληνικές λέξεις.
#
# Πεδία (υποχρεωτικά: id, category, strength, why, bad, good, registers):
#   strength   1 = δρας με μία εμφάνιση
#              2 = δρας κανονικά· προσεκτικός συγγραφέας σπάνια το κάνει σκόπιμα
#              3 = αδύναμο μόνο του: μετράει ΜΟΝΟ αν στην ίδια παράγραφο
#                  υπάρχουν τουλάχιστον δύο ακόμη σημάδια
#   absolute   true = δεν παρακάμπτεται από προτίμηση χρήστη ή δείγμα φωνής
#   why        ο μηχανισμός: γιατί το μοτίβο προδίδει AI. Με αυτό πιάνεις
#              και παραλλαγές που δεν είναι στη λίστα.
#   keep_when  πότε η ίδια φόρμα είναι θεμιτή (προαιρετικό)
#
# Πότε ΔΕΝ ενεργείς: μέσα σε παράθεμα, τίτλο ή κύριο όνομα· όταν το κείμενο
# μιλά ΓΙΑ τη φράση αντί να τη χρησιμοποιεί· όταν η «ιδιαιτερότητα»
# επαναλαμβάνεται συστηματικά ως ύφος (judgment.md §3)· όταν το κείμενο ήδη
# δουλεύει (judgment.md §7). Ένα σημάδι βαθμίδας 3 μόνο του δεν είναι λόγος
# αλλαγής.

patterns:

  # ─── ΑΠΟΛΥΤΑ ────────────────────────────────────────────────────────────

  - id: punct-em-dash-anti-elliniko
    category: punctuation
    strength: 1
    absolute: true
    bad: "— (em-dash) ή – (en-dash) μέσα σε ελληνική πρόταση ως διακοπή ή επεξήγηση"
    good: ", (κόμμα) / . (τελεία) / : (άνω-κάτω τελεία) / ( ) (παρένθεση)"
    why: "Η παύλα αφήνει τον γράφοντα να μη διαλέξει πώς σχετίζονται δύο προτάσεις. Τα LLMs τη σκορπίζουν παντού επειδή είναι κοινή στα αγγλικά· στην ελληνική στίξη πεζού λόγου δεν ανήκει."
    context: |
      Εξαίρεση μόνο: λογοτεχνικός διάλογος («— Καλημέρα, είπε»).
      Ούτε το δείγμα φωνής ούτε στιλιστική/ποιητική δικαιολογία παρακάμπτει.
    registers: [all]

  # ─── ΔΟΜΙΚΑ ΣΗΜΑΔΙΑ (ελληνικά που έγραψε κατευθείαν AI) ─────────────────
  # Επιζούν από κάθε αλλαγή μοντέλου, ενώ το λεξιλόγιο αλλάζει. Γι' αυτό
  # προηγούνται. Ψάξε τα και σε κλίμακα παραγράφου, όχι μόνο πρότασης.

  - id: struct-not-x-but-y
    category: ai_slop
    strength: 1
    bad: "«Δεν είναι απλώς μια εφαρμογή, είναι ένας νέος τρόπος να μαθαίνεις.» / «Δεν πρόκειται για Χ. Πρόκειται για Υ.» / «Δεν είναι λύπη. Δεν είναι κατάθλιψη. Είναι...» / κοφτή ουρά: «..., χωρίς άγχος.»"
    good: "Πες το Υ ευθέως: «Με την εφαρμογή μαθαίνεις δέκα λέξεις τη μέρα, στη στάση του λεωφορείου.»"
    why: "Το αρνητικό μισό απορρίπτει κάτι που κανείς δεν ισχυρίστηκε, ώστε το θετικό να ακούγεται μεγαλύτερο. Προσθέτει βάρος, όχι ισχυρισμό."
    keep_when: "Το αρνητικό μισό διορθώνει κάτι που ο αναγνώστης όντως πιστεύει ή μπερδεύει (λήμμα που ξεχωρίζει μια λέξη από τη διπλανή της: «Το χουζούρι δεν είναι απλώς ξεκούραση...»), ή είναι σύνθημα με ένα μόνο τέτοιο σχήμα. Το πολύ μία φορά ανά κείμενο. Στοιβαγμένες αρνήσεις φεύγουν πάντα."
    registers: [all]

  - id: struct-one-line-closer
    category: ai_slop
    strength: 1
    bad: "«Και αυτό τα λέει όλα.» / «Αυτή είναι η πραγματική νίκη.» / «Σκέψου το.» / «Το μήνυμα ήταν σαφές:» / σειρά κομματιών: «Χωρίς δικαιολογίες. Χωρίς εκπτώσεις. Χωρίς πισωγύρισμα.» / «Κάθε. Μέρα.»"
    good: "Κόψε το κλείσιμο που επαναλαμβάνει ή εξηγεί το παράδειγμα. Τα κομμάτια ένωσέ τα σε μία πρόταση με συγκεκριμένο ισχυρισμό."
    why: "Η ατάκα ζητά από τον αναγνώστη να σταθεί σε έναν ισχυρισμό αντί να του προσθέσει κάτι. Το ίδιο κλείσιμο μετά από κάθε ενότητα είναι το ίδιο σημάδι σε μεγαλύτερη κλίμακα."
    keep_when: "Η σύντομη πρόταση φέρνει νέο γεγονός ή συνέπεια που το παράδειγμα δεν έδειξε."
    registers: [all]

  - id: struct-staged-run-up
    category: ai_slop
    strength: 1
    bad: "«Ας το δούμε αναλυτικά.» / «Πάμε να βουτήξουμε.» / «Ιδού τι πρέπει να ξέρεις:» / «Η αλήθεια;» / «Ειλικρινά;» / «Το θέμα είναι το εξής:» / «Σε αυτό το άρθρο θα εξετάσουμε...» / ερώτηση-αποκάλυψη: «Το αποτέλεσμα; Ο χρόνος μειώθηκε στο μισό.» / «Ο λόγος; Απλός.»"
    good: "Ξεκίνα από το ίδιο το σημείο: «Η Next.js κρατά προσωρινά δεδομένα σε τρία επίπεδα.» / «Ο χρόνος απάντησης μειώθηκε στο μισό.»"
    why: "Ο γράφων αναγγέλλει το σημείο ή σκηνοθετεί μια στιγμή ειλικρίνειας ή αγωνίας αντί να το πει. Το «ειλικρινά» μέσα σε πρόταση είναι φυσικό· το σημάδι είναι η αυτόνομη εισαγωγή ή η ερώτηση που απαντά ο ίδιος πριν από κοινότοπο ισχυρισμό."
    registers: [all]

  - id: struct-arguing-with-no-one
    category: ai_slop
    strength: 1
    bad: "«Μη με παρεξηγήσεις, ...» / «Δεν λέω ότι...» / «Για να είμαστε ξεκάθαροι, ...» / «Κάποιος θα έλεγε ότι... Όμως...» / «Ο εύκολος δρόμος θα ήταν να...»"
    good: "Σβήσε την άμυνα· αν κρύβει πραγματικό ισχυρισμό, πες τον ισχυρισμό."
    why: "Το κείμενο απαντά σε αντίρρηση ή απορρίπτει επιλογή που δεν εμφανίζεται πουθενά αλλού. Συνήθως είναι κατάλοιπο από προηγούμενο προσχέδιο."
    keep_when: "Η αντίρρηση αποδίδεται σε κάποιον και απαντάται ολόκληρη, ή η επιλογή είναι κάτι που ο αναγνώστης όντως θα σκεφτόταν."
    registers: [all]

  - id: struct-chatbot-residue
    category: ai_slop
    strength: 1
    bad: "«Φυσικά!» / «Εξαιρετική ερώτηση!» / «Ορίστε μια εκδοχή:» / «Ελπίζω να βοήθησα!» / «Πες μου αν θέλεις να το επεκτείνω.»"
    good: "[αφαίρεση του περιτυλίγματος, μένει το περιεχόμενο]"
    why: "Χαιρετισμός, έπαινος ή προσφορά του chatbot έμεινε μέσα σε κείμενο που πρέπει να στέκεται μόνο του. Το πιο βέβαιο σημάδι και το πιο εύκολο να ξεφύγει όταν τυλίγει πραγματικό περιεχόμενο."
    registers: [all]

  # ─── AI SLOP ΦΟΡΜΕΣ (απόλυτος §11) ──────────────────────────────────────

  - id: ai-slop-listicle-tricolon
    category: ai_slop
    strength: 1
    absolute: true
    bad: "«Είναι ο φίλος που Χ. Ο σύντροφος που Υ. Ο συνεργάτης που Ζ.» / τρία παράλληλα παραδείγματα και μετά ένα δίδαγμα"
    good: "Τόσα στοιχεία όσα θέλει το νόημα: δύο διαφορετικές αποχρώσεις, ή τρία ανισομερή, ή απλή δήλωση χωρίς λίστα."
    why: "Οι ιδέες έρχονται ανά τρεις για να ακούγονται ολοκληρωμένες, είτε το νόημα έχει τρία μέρη είτε όχι. Pop-psych κλισέ κάθε motivational caption."
    registers: [all]

  - id: ai-slop-triple-stack
    category: ai_slop
    strength: 1
    absolute: true
    bad: "σταθερή, επίμονη και προσεκτική (επίθετα) / αλλοιωθεί, αναμειχθεί ή χαλάσει (ρήματα)"
    good: "Ένα ακριβές: «νοθευτεί» αντί «αλλοιωθεί/αναμειχθεί/χαλάσει». Δύο διαφορετικές αποχρώσεις είναι θεμιτές."
    why: "Τρία συνώνυμα στη σειρά είναι γέμισμα: το μοντέλο καλύπτει όλες τις πιθανές σημασίες αντί να διαλέξει τη σωστή."
    registers: [all]

  - id: ai-slop-therapy-speak
    category: ai_slop
    strength: 1
    absolute: true
    bad: "«η αλήθεια που ζει μέσα μας» / «συνήθεια που έχει γίνει ανάγκη» / «Στον πυρήνα του, αυτό που μετράει είναι...» / «Το πραγματικό ερώτημα είναι...» / αφορισμός: «Η εμπιστοσύνη είναι το νόμισμα της εποχής.»"
    good: "Πες ευθέως τον συγκεκριμένο ισχυρισμό: «Το ερώτημα είναι αν η ομάδα θα αλλάξει συνήθειες.»"
    why: "Ένα συνηθισμένο σημείο ντύνεται ως κρυμμένη αλήθεια ή απόφθεγμα, και το ντύσιμο δεν προσθέτει καμία λεπτομέρεια."
    registers: [all]

  - id: ai-slop-fake-poetic-metaphor
    category: ai_slop
    strength: 1
    absolute: true
    bad: "«η σκέψη που μένει με την πόρτα κλειστή» / «το πυροτέχνημα της στιγμής που σε στραγγίζει»"
    good: "Πραγματικές ελληνικές εικόνες (αν χρειάζονται) ή πεζή γλώσσα. Δεν εφευρίσκεις ποίηση."
    why: "Η μεταφορά δεν αντιστοιχεί σε ελληνική εικονογραφία ή ιδιωματισμό· είναι συνδυασμός λέξεων που απλώς ακούγεται λογοτεχνικός."
    registers: [all]

  - id: ai-slop-instagram-therapist-hook
    category: ai_slop
    strength: 1
    absolute: true
    bad: "«Σε αφήνουν άδειο. Αυτό λέγεται Χ.»"
    good: "Άρχισε με συγκεκριμένη σκηνή ή ερώτηση που δεν είναι δόλωμα."
    why: "Φόρμα clickbait: δημιουργεί τεχνητό κενό για να το γεμίσει με ετικέτα. Πάντα νιώθει χειριστική."
    registers: [all]

  - id: ai-slop-empty-marketing-claims
    category: ai_slop
    strength: 1
    absolute: true
    bad: "καθαρές και απλές εξηγήσεις / εξαιρετική ποιότητα / μοναδική εμπειρία / αξέχαστη εμπειρία / στην καρδιά της / μαγευτικό τοπίο"
    good: "Συγκεκριμένος ισχυρισμός ή κόψε τη φράση: «Ανθόμελο από τα Κύθηρα, τρύγος του Αυγούστου.»"
    why: "Γλώσσα διαφήμισης που ταιριάζει σε κάθε προϊόν άρα δεν περιγράφει κανένα. Αν δεν λες κάτι ακριβές, μην το πεις."
    registers: [marketing, casual]

  - id: ai-slop-anthropomorphic-things-want
    category: ai_slop
    strength: 1
    absolute: true
    bad: "«Υπάρχουν πράγματα που (δεν) θέλουν Χ. Θέλουν Υ.»"
    good: "«Κάποια πράγματα έχουν αξία μόνο όταν Χ.» / «Δεν χρειάζεται κάθε Χ να Υ.»"
    english_source: "Translated meme English"
    why: "Μεταφρασμένο αγγλικό meme. Στα ελληνικά τα αντικείμενα δεν θέλουν· άνθρωποι θέλουν, αντικείμενα είναι ή έχουν."
    registers: [marketing, casual]

  - id: ai-slop-citation-references
    category: ai_slop
    strength: 1
    absolute: true
    bad: "([Βικιλεξικό][1]) / (Μπαμπινιώτης 1998) / (πηγή: ΛΚΝ)"
    good: "[αφαίρεση: παραπομπές μόνο σε ακαδημαϊκό/νομικό κείμενο]"
    why: "Επινοημένες ή άσχετες παραπομπές δανείζονται κύρος. Σε TikTok/marketing/casual κάνουν το κείμενο να μοιάζει με επικόλληση από αναζήτηση."
    registers: [casual, marketing]

  - id: ai-slop-passive-listicle
    category: ai_slop
    strength: 2
    bad: "«Μπορεί να είναι Χ, αλλά και Υ, Ζ ή Α.»"
    good: "«Λέμε για Χ, αλλά και για έναν Υ ή μια Ζ που...»"
    why: "Απρόσωπο «μπορεί να είναι» και επίπεδη λίστα τεσσάρων: το μοντέλο απαριθμεί αντί να διαλέξει. Το φυσικό ελληνικό κρατά 2 με 3 στοιχεία με εναλλαγή άρθρων."
    registers: [marketing, casual]

  # ─── ΦΟΥΣΚΩΜΑ ΚΑΙ ΔΑΝΕΙΚΟ ΚΥΡΟΣ ─────────────────────────────────────────
  # Το γεγονός από κάτω συνήθως στέκει. Κράτα το, βγάλε το ντύσιμο.

  - id: inflation-ai-words
    category: word_choice
    strength: 2
    bad: "καθοριστικός / κομβικός / πολυδιάστατος / ολιστικός / αναδεικνύει / υπογραμμίζει / ξεκλειδώνω / απογειώνω / ενδυναμώνω (μεταφορικά) / ταξίδι (μεταφορικά: «το ταξίδι της μάθησης») / «σε έναν κόσμο που αλλάζει συνεχώς»"
    good: "Απλή λέξη ή συγκεκριμένο γεγονός: «σημαντικός», «δείχνει», «μαθαίνεις»."
    why: "Τα μοντέλα χρησιμοποιούν αυτές τις λέξεις πολύ συχνότερα από τους ανθρώπους, ειδικά σε ομάδες. Μία μόνη λόγια λέξη δεν είναι σημάδι· τρεις στην ίδια παράγραφο είναι."
    registers: [all]

  - id: inflation-significance
    category: ai_slop
    strength: 2
    bad: "«σηματοδοτεί μια νέα εποχή» / «αποτελεί ορόσημο» / «διαδραματίζει καθοριστικό ρόλο» / «αφήνει ανεξίτηλο στίγμα» / «Παρά τις προκλήσεις, συνεχίζει να ανθεί» / «Το μέλλον προμηνύεται λαμπρό»"
    good: "Κράτα το γεγονός, κόψε τη σημασία· τελείωσε στο τελευταίο συγκεκριμένο γεγονός. Αν η πηγή αναφέρει πραγματικά σχέδια, γράψε αυτά."
    why: "Μια συνηθισμένη λεπτομέρεια παρουσιάζεται ως ορόσημο, κληρονομιά ή υπόσχεση για το μέλλον. Εμφανίζεται σε τρεις κλίμακες: φράση, στοκ ενότητα «προκλήσεις και προοπτικές», αποχαιρετιστήρια παράγραφος."
    registers: [all]

  - id: inflation-copula-avoidance
    category: syntax
    strength: 2
    bad: "«αποτελεί τον χώρο εκθέσεων» / «συνιστά» / «λειτουργεί ως» / «διαθέτει τέσσερις αίθουσες» / «προσφέρει» / «καυχιέται για»"
    good: "«είναι» / «έχει», ή ρήμα που κάνει δουλειά: «Η γκαλερί έχει τέσσερις αίθουσες.»"
    why: "Απλά ρήματα αντικαθίστανται με μακρύτερα για να ακούγονται επίσημα. Συμβατό με §4: κι εκεί ο στόχος είναι ρήμα που κάνει δουλειά, όχι ψευδοσυνδετικό."
    registers: [all]

  - id: inflation-participle-rider
    category: ai_slop
    strength: 2
    bad: "«..., αναδεικνύοντας τη σημασία της κοινότητας» / «..., υπογραμμίζοντας...» / «..., συμβάλλοντας στην ανάπτυξη...» / «..., αντανακλώντας...»"
    good: "Κράτα το γεγονός· κράτα την ουρά μόνο αν η πηγή στηρίζει αυτό που ισχυρίζεται."
    why: "Μετοχή σε -οντας κολλημένη σε απλό γεγονός για να ακούγεται βαθύτερο. Αγγλικό -ing rider μεταφερμένο στα ελληνικά."
    registers: [all]

  - id: inflation-borrowed-authority
    category: ai_slop
    strength: 2
    bad: "«Οι ειδικοί συμφωνούν ότι...» / «Μελέτες δείχνουν...» / «Έχει αναφερθεί από Καθημερινή, BBC και Guardian»"
    good: "Ονόμασε την πραγματική πηγή και τι είπε, ή κόψε τον ισχυρισμό ή τη λίστα."
    why: "Ανώνυμη αυθεντία στηρίζει ισχυρισμό· λίστα από ονόματα μέσων στηρίζει πρόσωπο. Η απουσία παραπομπής μόνη της δεν είναι σημάδι."
    registers: [all]

  - id: format-decoration
    category: ai_slop
    strength: 2
    bad: "**Ταχύτητα:** Η ταχύτητα βελτιώθηκε. / 🚀 **Φάση Εκκίνησης:** ... / bold σε κάθε δεύτερη έννοια / οριζόντια γραμμή ανάμεσα σε κάθε ενότητα"
    good: "Βγάλε το bold και τα emoji· λίστα με ετικέτες που δεν προσθέτουν πληροφορία γίνεται πρόζα: «Η ενημέρωση φορτώνει γρηγορότερα και προσθέτει κρυπτογράφηση.»"
    why: "Διακόσμηση εφαρμοσμένη σε κάθε στοιχείο από κανόνα, όχι επειδή κάτι χρειάζεται έμφαση."
    keep_when: "Το σενάριο ορίζει τη μορφή (π.χ. ετικέτες λήμματος στο lexilog-app-entry): το σενάριο υπερισχύει."
    registers: [all]

  # ─── ΑΔΥΝΑΜΑ ΜΟΝΑ ΤΟΥΣ (μετράνε μόνο με παρέα) ──────────────────────────

  - id: weak-repeated-openings
    category: syntax
    strength: 3
    bad: "«Μπαίνεις στο μαγαζί. Βλέπεις τα ράφια. Νιώθεις τη μυρωδιά.» / «Σημείωσε... Σημείωσε... Κατέγραψε...»"
    good: "Ένωσε τις προτάσεις ή άλλαξε υποκείμενο/ρήμα εκκίνησης."
    why: "Η επανάληψη ρυθμίζεται από κανόνα, όχι από αυτί. Οι άνθρωποι επαναλαμβάνουν και σκόπιμα, γι' αυτό μόνο του δεν αρκεί."
    registers: [all]

  - id: weak-hedge-stack
    category: filler
    strength: 3
    bad: "«θα μπορούσε ενδεχομένως να θεωρηθεί ότι ίσως...»"
    good: "Ένας επιφυλακτικός όρος, μόνο αν η πηγή στηρίζει την αμφιβολία: «ίσως επηρεάζει»."
    why: "Διαδοχικές επιμέλειες προσθέτουν επιφύλαξη πάνω σε επιφύλαξη για να διορθώσουν παλιότερη υπερβολή. Ένα «ίσως» είναι ανθρώπινο."
    registers: [all]

  - id: filler-omos-empty-pivot
    category: filler
    strength: 3
    bad: "«Τι σημαίνει, όμως, στην πράξη;»"
    good: "«Τι σημαίνει στην πράξη;»"
    why: "Το «όμως» δημιουργεί ψεύτικη αντίθεση. Όταν δεν υπάρχει αντίθεση, ο σύνδεσμος είναι κενό συνδετικό υλικό."
    registers: [all]

  # ─── CALQUES (μεταφρασμένοι ιδιωματισμοί) ───────────────────────────────
  # Λάθος ελληνικά, όχι απλώς ύφος: δρας με μία εμφάνιση.

  - id: calque-makes-sense
    category: calque
    strength: 1
    bad: "έχει νόημα (όταν εννοείς 'is logical')"
    good: "βγάζει νόημα / στέκει / είναι λογικό"
    english_source: "it makes sense"
    why: "«Έχει νόημα» σημαίνει 'έχει σκοπό' (σωστό στο «η ζωή έχει νόημα»). Για λογική συνέπεια το ελληνικό λέει «βγάζει νόημα» ή «στέκει»."
    registers: [all]

  - id: calque-take-care-of
    category: calque
    strength: 1
    bad: "πάρε φροντίδα"
    good: "θα το φροντίσω / θα το αναλάβω / θα το κανονίσω"
    english_source: "take care of it"
    why: "Λέξη προς λέξη απόδοση αγγλικού phrasal verb."
    registers: [all]

  - id: calque-make-a-decision
    category: calque
    strength: 1
    bad: "κάνω μια απόφαση"
    good: "παίρνω μια απόφαση"
