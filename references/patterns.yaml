    registers: [all]

  - id: calque-make-sure
    category: calque
    strength: 1
    bad: "κάνε σίγουρο"
    good: "βεβαιώσου / φρόντισε / σιγουρέψου"
    english_source: "make sure"
    why: "Λέξη προς λέξη απόδοση αγγλικής σύνταξης."
