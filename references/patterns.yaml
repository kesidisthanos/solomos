    good: "πες μου / ενημέρωσέ με"
    english_source: "let me know"
    why: "Λέξη προς λέξη απόδοση· στα ελληνικά δεν υπάρχει αυτή η σύνταξη."
    registers: [all]

  - id: calque-feel-free
    category: calque
    strength: 1
