    why: "Όταν περιγράφεις τη δουλειά σου στα ελληνικά, τα αμετάφραστα τεχνικά αγγλικά δείχνουν ότι σκέφτεσαι στα αγγλικά."
    registers: [meta]

  - id: meta-katharizo-keimeno
