  # ─── ΟΡΘΟΓΡΑΦΙΑ ─────────────────────────────────────────────────────────

  - id: punct-na-pou-pws-tonal
    category: punctuation
    strength: 1
    bad: "Θέλω νά πάω / Λέει πώς θα έρθει / Ο άνθρωπος πού ήρθε χθες"
    good: "Θέλω να πάω / Λέει πως θα έρθει / Ο άνθρωπος που ήρθε χθες"
    why: "Σφάλμα επηρεασμένο από Greeklish/AI. Το «να» χωρίς τόνο· το «πού/πώς» μόνο όταν είναι ερωτηματικά."
    context: "Διορθώνεις σιωπηλά."
    registers: [all]

  # ─── ΜΕΤΑΓΛΩΣΣΑ (όταν περιγράφεις τη δουλειά σου ή μιλάς για γλώσσα) ──

  - id: meta-osfritikes-metafores
    category: word_choice
    strength: 2
    bad: "μυρίζει αγγλική σκέψη / μυρίζει μετάφραση / έχει άρωμα μετάφρασης"
    good: "προδίδει αγγλική αφετηρία / φαίνεται μεταφρασμένο / ακούγεται ξενικό / κουβαλάει αγγλική σκέψη"
    english_source: "smells of translation / reeks of English"
    why: "Calque του 'smells of / reeks of' όταν το αντικείμενο είναι γλώσσα ή σκέψη."
    context: |
      Προεπιλογή, όχι απόλυτος (§9). Αντικαθιστάς πάντα, εκτός αν ο χρήστης
      ζητήσει ρητά να μείνει. Οι ελληνικές οσφρητικές εκφράσεις που ήδη
      υπάρχουν («κάτι μου μυρίζει», «μυρίζει μπαρούτι») δεν πειράζονται.
    registers: [all, meta]

  - id: meta-untranslated-tech-terms
    category: meta-language
    strength: 2
    bad: "pattern / harness / skill / load / run / process / pipeline (αμετάφραστα μέσα σε ελληνική πρόταση)"
